<!doctype html>
<html lang="en" class="dark scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2306b6d4' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polygon points='12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary SEO -->
    <title>Amit Chauhan — Software Engineer & AI Developer</title>
    <meta name="title" content="Amit Chauhan — Software Engineer & AI Developer" />
    <meta name="description" content="Personal portfolio of Amit Chauhan, Software Engineer &amp; AI Developer specializing in scalable full-stack web applications, distributed architectures, and hybrid AI solutions." />
    <meta name="keywords" content="Amit Chauhan, Portfolio, CS Student, Software Engineer, Full-Stack Developer, AI Developer, React, TypeScript, Python, Node.js" />
    <meta name="author" content="Amit Chauhan" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="http://localhost:3000/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Amit Chauhan — Software Engineer & AI Developer" />
    <meta property="og:description" content="Building intelligent systems, scalable full-stack web applications, and hybrid AI solutions." />
    <meta property="og:site_name" content="Amit Chauhan Portfolio" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:title" content="Amit Chauhan — Software Engineer & AI Developer" />
    <meta property="twitter:description" content="Building intelligent systems, scalable full-stack web applications, and hybrid AI solutions." />

    <!-- Structured JSON-LD Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Person",
          "@id": "http://localhost:3000/#person",
          "name": "Amit Chauhan",
          "jobTitle": "Software Engineer & AI Developer",
          "description": "Building intelligent systems, scalable full-stack web applications, and hybrid AI solutions.",
          "url": "http://localhost:3000",
          "sameAs": [
            "https://www.linkedin.com/in/amit-chauhan-613833329",
            "https://github.com/amitchn28"
          ],
          "knowsAbout": [
            "Software Engineering",
            "Full-Stack Development",
            "Artificial Intelligence",
            "TypeScript",
            "React",
            "Node.js",
            "Python",
            "PostgreSQL"
          ]
        },
        {
          "@type": "WebSite",
          "@id": "http://localhost:3000/#website",
          "url": "http://localhost:3000",
          "name": "Amit Chauhan — Software Engineer & AI Developer Portfolio",
          "description": "Official personal portfolio showcasing engineering projects, technical skills, and research.",
          "publisher": { "@id": "http://localhost:3000/#person" }
        }
      ]
    }
    </script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Orbitron:wght@700;800;900&family=Outfit:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700&family=Silkscreen:wght@400;700&family=Space+Grotesk:wght@500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">

    <!-- Zero-Flash Immediate Theme & Typography Initializer -->
    <script>
      (function() {
        try {
          var t = localStorage.getItem('amit_site_theme') || 'sapphire-glow';
          var f = localStorage.getItem('amit_font_mode') || 'modern';
          document.documentElement.setAttribute('data-theme', t);
          document.documentElement.setAttribute('data-font-mode', f);
        } catch(e) {}
      })();
    </script>
  </head>
  <body class="bg-[#020617] text-slate-100 antialiased selection:bg-cyan-500 selection:text-black overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
